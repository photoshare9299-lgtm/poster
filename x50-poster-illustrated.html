<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proton X50 Illustrated Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #f5f2ec; }
  .poster { display: block; }
  .display { font-family: "Archivo", sans-serif; font-weight: 900; font-stretch: 78%; }
  .body { font-family: "Inter", sans-serif; }
</style>
</head>
<body>
<svg class="poster" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg"
     stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <!-- palette (kept in one place for easy tweaks) -->
    <style>
      .ink { stroke: #111; }
      .blue { fill: #1683e6; }
      .peach { fill: #f8bf9e; }
      .cream { fill: #f3ead8; }
      .coral { fill: #f07a64; }
      .yellow { fill: #f6d23a; }
      .navy { fill: #2c4a86; }
      .sage { fill: #4c7a62; }
      .lav { fill: #c9cbe3; }
    </style>

    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#111"/>
      <circle cx="6" cy="6" r="1.25" fill="#111"/>
    </pattern>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#f7f6f2"/>
      <path d="M26 0 V26 M0 26 H26" stroke="#6fa3dc" stroke-width="1.2"/>
    </pattern>
    <pattern id="stripes" width="34" height="24" patternUnits="userSpaceOnUse">
      <rect width="34" height="24" fill="#c9cbe3"/>
      <path d="M8 24 L14 0 H20 L14 24 Z" fill="#f6d23a"/>
    </pattern>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="frameClip"><rect x="40" y="40" width="1000" height="1200"/></clipPath>
    <clipPath id="screenClip"><rect x="490" y="510" width="320" height="530" rx="30"/></clipPath>
    <clipPath id="thumbClip"><rect x="0" y="0" width="92" height="92"/></clipPath>
    <clipPath id="portraitClip"><rect x="80" y="80" width="116" height="116"/></clipPath>
    <clipPath id="palmClip">
      <path d="M 450 880 C 412 990, 452 1070, 532 1120 C 592 1158, 632 1200, 652 1245 L 1045 1245 L 1045 992 C 962 930, 918 870, 904 820 L 800 820 L 800 700 L 480 700 L 480 880 Z"/>
    </clipPath>

    <!-- Compact SUV, side profile facing right. Children inherit stroke-width from <use>. -->
    <g id="suv" stroke="#111">
      <path fill="#ee5a46" d="M 48 262 L 40 190 Q 40 150 58 124 L 92 92 Q 108 76 140 72 L 440 66
        Q 470 66 492 80 L 590 140 L 712 156 Q 770 164 778 200 L 780 250 Q 780 264 762 266 L 694 266
        A 64 64 0 0 0 566 266 L 254 266 A 64 64 0 0 0 126 266 L 66 266 Q 50 266 48 262 Z"/>
      <path fill="#111" stroke="none" d="M 92 92 Q 108 76 140 72 L 440 66 Q 470 66 492 80 L 500 86 L 104 98 Z"/>
      <path fill="#2c4a86" d="M 112 112 Q 124 96 154 94 L 436 88 Q 462 88 480 98 L 578 150 L 128 142 Q 106 132 112 112 Z"/>
      <path fill="#c9cbe3" stroke="none" d="M 262 96 L 316 95 L 274 140 L 240 140 Z"/>
      <path fill="#111" stroke="none" d="M 214 94 L 238 94 L 240 146 L 220 146 Z"/>
      <path fill="#111" stroke="none" d="M 404 89 L 422 89 L 424 150 L 406 150 Z"/>
      <path fill="none" d="M 240 148 L 246 262 M 424 150 L 428 262"/>
      <rect x="318" y="180" width="36" height="9" rx="4.5" fill="#f3ead8"/>
      <rect x="500" y="182" width="36" height="9" rx="4.5" fill="#f3ead8"/>
      <path fill="#111" stroke="none" d="M 254 266 L 566 266 L 562 246 L 258 246 Z"/>
      <path fill="none" stroke-width="16" d="M 118 266 A 72 72 0 0 1 262 266 M 558 266 A 72 72 0 0 1 702 266"/>
      <path fill="#111" stroke="none" d="M 42 228 L 48 262 Q 50 266 66 266 L 112 266 Q 112 242 118 228 Z"/>
      <path fill="#111" stroke="none" d="M 708 232 Q 702 250 702 266 L 762 266 Q 780 264 780 250 L 780 232 Z"/>
      <path fill="#111" d="M 548 128 L 588 124 Q 598 138 584 144 L 556 144 Z"/>
      <path fill="#f6d23a" d="M 716 168 L 774 180 Q 778 188 770 190 L 720 182 Z"/>
      <path fill="#b8281a" d="M 42 150 L 74 146 L 70 164 L 44 166 Z"/>
      <circle cx="190" cy="272" r="58" fill="#111"/>
      <circle cx="190" cy="272" r="34" fill="#c9cbe3"/>
      <circle cx="630" cy="272" r="58" fill="#111"/>
      <circle cx="630" cy="272" r="34" fill="#c9cbe3"/>
      <path fill="none" stroke-width="9" d="M 190 244 V 300 M 162 272 H 218 M 630 244 V 300 M 602 272 H 658"/>
      <circle cx="190" cy="272" r="9" fill="#f6d23a"/>
      <circle cx="630" cy="272" r="9" fill="#f6d23a"/>
    </g>
  </defs>

  <!-- paper -->
  <rect width="1080" height="1350" fill="#f5f2ec"/>

  <g clip-path="url(#frameClip)">
    <!-- grid paper + blue sky with wavy edge -->
    <rect x="40" y="40" width="1000" height="1200" fill="url(#grid)"/>
    <path class="blue" stroke="#111" stroke-width="4" d="M 36 36 H 1044 V 690 C 1000 680, 975 735, 915 738
      C 850 742, 830 700, 760 702 L 340 702 C 260 702, 250 770, 170 772 C 110 774, 80 752, 36 752 Z"/>

    <!-- ===== Row 1: portrait card ===== -->
    <rect x="78" y="78" width="140" height="140" fill="#111"/>
    <rect x="68" y="68" width="140" height="140" class="yellow ink" stroke-width="4"/>
    <rect x="80" y="80" width="116" height="116" fill="#e7dcc8" class="ink" stroke-width="3.5"/>
    <g clip-path="url(#portraitClip)" class="ink" stroke-width="3.5">
      <path d="M 86 120 L 100 112 M 182 100 L 192 92 M 88 168 L 98 172" fill="none" stroke-width="2.5"/>
      <path fill="#fff" d="M 92 200 Q 96 162 138 158 Q 180 162 184 200 Z"/>
      <path fill="url(#dots)" opacity=".55" stroke="none" d="M 92 200 Q 96 162 138 158 Q 180 162 184 200 Z"/>
      <ellipse cx="138" cy="126" rx="25" ry="27" class="peach"/>
      <path class="navy" d="M 112 128 Q 106 94 138 94 Q 170 94 164 128 Q 158 108 142 106 Q 126 114 112 128 Z"/>
      <path fill="none" stroke-width="3" d="M 124 130 Q 129 124 134 130 M 142 130 Q 147 124 152 130 M 131 140 Q 138 148 145 140"/>
      <circle cx="122" cy="139" r="4" class="coral" stroke="none" opacity=".8"/>
      <circle cx="154" cy="139" r="4" class="coral" stroke="none" opacity=".8"/>
      <circle cx="181" cy="99" r="9" class="yellow"/>
      <circle cx="181" cy="99" r="3" fill="#111" stroke="none"/>
      <path d="M 181 108 V 116" stroke-width="5"/>
      <circle cx="180" cy="122" r="10" class="peach"/>
    </g>
    <path d="M 164 74 L 170 62 M 180 80 L 192 72" class="ink" stroke-width="3" fill="none"/>

    <!-- ===== Row 1: progress bar + rope tug ===== -->
    <rect x="244" y="84" width="420" height="32" fill="#e7dcc8"/>
    <rect x="244" y="84" width="336" height="32" class="sage"/>
    <rect x="580" y="84" width="26" height="32" class="navy"/>
    <rect x="244" y="84" width="420" height="32" fill="none" class="ink" stroke-width="4"/>
    <path d="M 580 84 V 116 M 606 84 V 116" class="ink" stroke-width="3"/>
    <text x="262" y="106" class="display" font-size="19" fill="#f3ead8" letter-spacing="2.5">DRIVE INTO NOVEMBER</text>

    <rect x="244" y="150" width="20" height="40" fill="#111"/>
    <rect x="250" y="160" width="8" height="20" class="lav"/>
    <path d="M 264 170 L 590 182" stroke="#111" stroke-width="10" fill="none"/>
    <path d="M 264 170 L 590 182" stroke="#f6d23a" stroke-width="4" fill="none"/>
    <circle cx="304" cy="171" r="11" fill="none" stroke="#111" stroke-width="7"/>
    <circle cx="304" cy="171" r="11" fill="none" stroke="#f07a64" stroke-width="3"/>
    <use href="#suv" transform="translate(697,152) scale(-0.14,0.14)" stroke-width="22"/>
    <g transform="rotate(16 664 128)" class="yellow ink" stroke-width="3">
      <path d="M 656 102 L 674 102 L 668 136 L 660 136 Z"/>
      <circle cx="664" cy="146" r="5"/>
    </g>
    <path d="M 690 120 L 702 112 M 694 140 L 708 140" class="ink" stroke-width="3" fill="none"/>

    <!-- ===== Row 1: icon bubble ===== -->
    <circle cx="996" cy="94" r="30" class="peach ink" stroke-width="4"/>
    <circle cx="996" cy="184" r="30" class="peach ink" stroke-width="4"/>
    <ellipse cx="860" cy="138" rx="128" ry="66" fill="#fff" class="ink" stroke-width="4"/>
    <ellipse cx="860" cy="138" rx="126" ry="64" fill="url(#dots)" opacity=".45"/>
    <path d="M 742 76 Q 760 60 790 56 M 920 212 Q 900 222 870 222 M 800 216 Q 790 214 780 210" class="ink" stroke-width="3" fill="none"/>
    <g transform="translate(796 140) rotate(-30)" class="ink" stroke-width="3.5">
      <rect x="-5" y="-4" width="10" height="38" class="navy"/>
      <rect x="5" y="20" width="9" height="6" class="navy"/>
      <rect x="5" y="28" width="6" height="5" class="navy"/>
      <circle cx="0" cy="-18" r="15" class="navy"/>
      <circle cx="0" cy="-18" r="5" class="cream"/>
    </g>
    <g transform="translate(862 138)" class="ink" stroke-width="3.5">
      <circle r="28" class="yellow"/>
      <circle r="18" fill="#fff"/>
      <rect x="-18" y="-3.5" width="36" height="7" class="yellow" stroke-width="3"/>
      <rect x="-3.5" y="0" width="7" height="18" class="yellow" stroke-width="3"/>
      <circle r="8" class="yellow"/>
    </g>
    <g class="ink" stroke-width="3.5">
      <rect x="908" y="114" width="46" height="46" rx="9" class="blue"/>
      <text x="931" y="148" text-anchor="middle" class="display" font-size="32" fill="#fff" stroke="none">P</text>
    </g>

    <!-- ===== Headline ===== -->
    <g class="display" stroke-linejoin="round">
      <text x="75" y="319" font-size="98" fill="#111" stroke="#111" stroke-width="10">YOUR FIRST SUV,</text>
      <text x="68" y="312" font-size="98" fill="#fbf4e6" stroke="#111" stroke-width="10" style="paint-order: stroke fill">YOUR FIRST SUV,</text>
      <text x="76" y="460" font-size="172" fill="#111" stroke="#111" stroke-width="12">SORTED.</text>
      <text x="68" y="452" font-size="172" fill="#f6d23a" stroke="#111" stroke-width="12" style="paint-order: stroke fill">SORTED.</text>
    </g>
    <path d="M 754 372 L 780 352 M 760 404 L 796 398 M 754 436 L 786 448" class="ink" stroke-width="5" fill="none"/>

    <!-- ===== Sticker ===== -->
    <g transform="translate(944 586) rotate(-12)">
      <circle r="62" fill="#111" transform="translate(6 6)"/>
      <circle r="62" class="coral ink" stroke-width="4"/>
      <circle r="51" fill="none" stroke="#f3ead8" stroke-width="2.5" stroke-dasharray="6 6"/>
      <g class="display" fill="#f3ead8" text-anchor="middle">
        <text y="-16" font-size="21">FEEL IT</text>
        <text y="4" font-size="16" class="body" font-weight="700">for</text>
        <text y="25" font-size="18">YOURSELF</text>
      </g>
    </g>

    <!-- ===== Hand (behind phone) ===== -->
    <path class="peach ink" stroke-width="5" d="M 450 880 C 412 990, 452 1070, 532 1120 C 592 1158, 632 1200, 652 1245 L 1045 1245 L 1045 992 C 962 930, 918 870, 904 820 L 800 820 L 800 700 L 480 700 L 480 880 Z"/>
    <g clip-path="url(#palmClip)">
      <path d="M 500 1060 L 822 1060 L 796 1150 L 600 1210 Z" fill="#8d93b3" opacity=".85"/>
      <path d="M 500 1060 L 822 1060 L 796 1150 L 600 1210 Z" fill="url(#dots)" opacity=".35"/>
    </g>
    <g class="peach ink" stroke-width="5">
      <rect x="372" y="610" width="150" height="80" rx="40"/>
      <rect x="384" y="686" width="140" height="78" rx="39"/>
      <rect x="398" y="760" width="126" height="74" rx="37"/>
      <rect x="414" y="830" width="110" height="64" rx="32"/>
    </g>

    <!-- ===== Phone ===== -->
    <rect x="484" y="500" width="360" height="570" rx="46" fill="#111"/>
    <rect x="470" y="490" width="360" height="570" rx="46" class="blue ink" stroke-width="5"/>
    <rect x="490" y="510" width="320" height="530" rx="30" fill="#e7dcc8" class="ink" stroke-width="4"/>
    <g clip-path="url(#screenClip)">
      <!-- status bar -->
      <rect x="506" y="526" width="74" height="14" class="sage"/>
      <rect x="580" y="526" width="44" height="14" class="navy"/>
      <rect x="506" y="526" width="118" height="14" fill="none" class="ink" stroke-width="2.5"/>
      <path d="M 636 540 L 648 528 L 648 540 Z" class="yellow ink" stroke-width="2.5"/>
      <path d="M 660 538 H 690 M 702 528 V 540 M 710 528 V 540 M 718 528 V 540" class="ink" stroke-width="3"/>
      <rect x="748" y="526" width="40" height="14" rx="4" class="coral ink" stroke-width="2.5"/>
      <rect x="790" y="530" width="4" height="6" fill="#111"/>
      <path d="M 506 556 H 794" class="ink" stroke-width="3"/>

      <!-- model badge -->
      <ellipse cx="572" cy="608" rx="60" ry="29" fill="#111"/>
      <path d="M 544 593 L 548 603 L 559 603 L 550 610 L 554 621 L 544 614 L 534 621 L 538 610 L 529 603 L 540 603 Z" class="yellow"/>
      <text x="562" y="618" class="display" font-size="28" fill="#fff">X50</text>

      <!-- crop frame with sun -->
      <rect x="666" y="578" width="124" height="112" fill="#fff" class="ink" stroke-width="3"/>
      <circle cx="728" cy="634" r="28" class="yellow ink" stroke-width="3"/>
      <path d="M 728 606 A 28 28 0 0 1 728 662 Z" fill="url(#dots)" opacity=".5"/>
      <g class="navy ink" stroke-width="2.5">
        <rect x="659" y="571" width="14" height="14"/><rect x="783" y="571" width="14" height="14"/>
        <rect x="659" y="683" width="14" height="14"/><rect x="783" y="683" width="14" height="14"/>
      </g>

      <!-- floor -->
      <rect x="480" y="868" width="340" height="54" class="yellow ink" stroke-width="3.5"/>
      <path d="M 500 890 H 530 M 560 906 H 600 M 640 892 H 668 M 700 908 H 740 M 770 892 H 800" class="ink" stroke-width="3"/>

      <!-- comment input -->
      <rect x="506" y="952" width="266" height="48" rx="24" fill="#fff" class="ink" stroke-width="3"/>
      <text x="526" y="983"><tspan class="display" font-size="22" fill="#1683e6">X50</tspan><tspan class="body" font-size="18" font-weight="500" fill="#7a7f93" dx="8">@yourbestie</tspan></text>
      <circle cx="748" cy="976" r="17" class="blue ink" stroke-width="3"/>
      <path d="M 742 968 L 756 976 L 742 984 Z" fill="#fff"/>
    </g>

    <!-- the X50 pops out of the screen -->
    <path d="M 360 770 L 392 778 M 352 802 L 392 802 M 360 834 L 392 826" class="ink" stroke-width="5" fill="none"/>
    <use href="#suv" transform="translate(800,715) scale(-0.5,0.5)" stroke-width="9"/>

    <!-- ===== Thumb + wrist (in front) ===== -->
    <path class="peach ink" stroke-width="5" d="M 800 1120 C 786 1000, 784 880, 796 800 C 804 744, 892 740, 904 796 C 918 870, 962 930, 1045 992 L 1045 1245 L 690 1245 C 740 1200, 790 1172, 800 1120 Z"/>

    <!-- watch -->
    <g transform="translate(940 1150)" class="ink">
      <circle r="78" class="blue" stroke-width="5"/>
      <circle r="60" fill="#fff" stroke-width="4"/>
      <circle r="58" fill="url(#dots)" opacity=".4" stroke="none"/>
      <path d="M 0 -48 V -40 M 48 0 H 40 M -48 0 H -40" stroke-width="4"/>
      <path d="M 0 0 L -14 -34 M 0 0 L 26 22" stroke-width="7"/>
      <circle r="7" class="yellow" stroke-width="3"/>
      <text y="38" text-anchor="middle" class="display" font-size="15" fill="#111" stroke="none" letter-spacing="1">NOV</text>
    </g>

    <!-- ===== Left column: feature cards ===== -->
    <g id="cards">
      <!-- card 1: high driving position -->
      <rect x="75" y="499" width="282" height="114" rx="10" fill="#111"/>
      <rect x="68" y="492" width="282" height="114" rx="10" class="cream ink" stroke-width="4"/>
      <g transform="translate(80 503)">
        <g clip-path="url(#thumbClip)" class="ink" stroke-width="3">
          <rect width="92" height="92" fill="#fff"/>
          <rect width="92" height="92" fill="url(#dots)" opacity=".45" stroke="none"/>
          <rect x="48" y="12" width="34" height="9" rx="4.5" class="coral" stroke-width="2.5"/>
          <path d="M -6 96 L 30 34 L 66 96 Z" class="lav"/>
          <path d="M 30 34 L 21 50 L 30 45 L 38 50 Z" fill="#fff" stroke-width="2.5"/>
          <path d="M 38 96 L 70 44 L 102 96 Z" class="lav"/>
          <path d="M 70 44 L 61 59 L 70 54 L 79 59 Z" fill="#fff" stroke-width="2.5"/>
          <path d="M 22 80 L 26 70 M 72 84 L 74 72 M 84 80 L 82 72" stroke-width="2.5" fill="none"/>
        </g>
        <rect width="92" height="92" fill="none" class="ink" stroke-width="3.5"/>
      </g>
      <text class="body" font-size="23" font-weight="800" fill="#111"><tspan x="188" y="542">High driving</tspan><tspan x="188" y="570">position</tspan></text>

      <!-- card 2: comfortable cabin -->
      <rect x="75" y="629" width="282" height="114" rx="10" fill="#111"/>
      <rect x="68" y="622" width="282" height="114" rx="10" class="cream ink" stroke-width="4"/>
      <g transform="translate(80 633)">
        <g clip-path="url(#thumbClip)" class="ink" stroke-width="3">
          <rect width="92" height="92" fill="#e7dcc8"/>
          <rect y="72" width="92" height="22" class="yellow"/>
          <path d="M 8 82 H 20 M 50 86 H 66" stroke-width="2.5"/>
          <rect x="22" y="22" width="26" height="50" rx="10" class="coral" transform="rotate(-12 35 47)"/>
          <rect x="22" y="6" width="22" height="13" rx="5" class="coral" transform="rotate(-12 33 12)"/>
          <rect x="28" y="56" width="42" height="17" rx="7" class="coral"/>
          <path d="M 76 52 C 66 36, 70 22, 74 16 C 80 26, 82 40, 76 52 Z" class="sage" stroke-width="2.5"/>
          <path d="M 78 54 C 86 42, 92 38, 96 36 C 94 48, 88 54, 78 54 Z" class="sage" stroke-width="2.5"/>
          <rect x="70" y="52" width="16" height="20" fill="#fff"/>
        </g>
        <rect width="92" height="92" fill="none" class="ink" stroke-width="3.5"/>
      </g>
      <text class="body" font-size="23" font-weight="800" fill="#111"><tspan x="188" y="672">Comfortable</tspan><tspan x="188" y="700">cabin</tspan></text>

      <!-- card 3: easy to park around PJ -->
      <rect x="75" y="759" width="282" height="114" rx="10" fill="#111"/>
      <rect x="68" y="752" width="282" height="114" rx="10" class="cream ink" stroke-width="4"/>
      <g transform="translate(80 763)">
        <g clip-path="url(#thumbClip)" class="ink" stroke-width="3">
          <rect width="92" height="92" class="navy"/>
          <path d="M 6 84 H 86 M 6 40 V 84 M 86 40 V 84" stroke="#fff" stroke-width="3.5" fill="none"/>
          <use href="#suv" transform="translate(83 44) scale(-0.093,0.093)" stroke-width="32"/>
          <rect x="8" y="6" width="28" height="28" rx="6" class="yellow"/>
          <text x="22" y="28" text-anchor="middle" class="display" font-size="22" fill="#2c4a86" stroke="none">P</text>
        </g>
        <rect width="92" height="92" fill="none" class="ink" stroke-width="3.5"/>
      </g>
      <text class="body" font-size="23" font-weight="800" fill="#111"><tspan x="188" y="802">Easy to park</tspan><tspan x="188" y="830">around PJ</tspan></text>
    </g>

    <!-- ===== Left column: CTA button ===== -->
    <rect x="75" y="895" width="282" height="78" rx="39" fill="#111"/>
    <rect x="68" y="888" width="282" height="78" rx="39" class="yellow ink" stroke-width="4"/>
    <text x="88" y="935" class="display" font-size="23" fill="#111" letter-spacing=".3">BOOK A TEST DRIVE</text>
    <circle cx="322" cy="927" r="17" fill="#111"/>
    <path d="M 314 927 H 330 M 323 920 L 330 927 L 323 934" stroke="#f6d23a" stroke-width="3.5" fill="none"/>

    <!-- ===== Left column: comment bubble ===== -->
    <path d="M 82 990 H 336 Q 350 990 350 1004 V 1096 Q 350 1110 336 1110 H 124 L 92 1136 L 98 1110 H 82 Q 68 1110 68 1096 V 1004 Q 68 990 82 990 Z" fill="#fff" class="ink" stroke-width="4"/>
    <text x="88" y="1032" class="display" font-size="31" fill="#111">COMMENT <tspan fill="#1683e6">“X50”</tspan></text>
    <text class="body" font-size="19" font-weight="600" fill="#333"><tspan x="88" y="1064">&amp; tag a friend who’s</tspan><tspan x="88" y="1090">ready to upgrade.</tspan></text>

    <!-- ===== Left column: slider deco ===== -->
    <circle cx="86" cy="1172" r="10" class="coral ink" stroke-width="3.5"/>
    <path d="M 108 1172 H 296" class="ink" stroke-width="3.5" stroke-dasharray="7 9"/>
    <circle cx="322" cy="1172" r="13" fill="#fff" class="ink" stroke-width="3.5"/>
    <circle cx="322" cy="1172" r="5" class="coral"/>
    <rect x="68" y="1196" width="282" height="22" fill="url(#stripes)"/>
    <rect x="68" y="1196" width="96" height="22" class="sage"/>
    <rect x="164" y="1196" width="70" height="22" class="navy"/>
    <rect x="68" y="1196" width="282" height="22" fill="none" class="ink" stroke-width="3.5"/>
  </g>

  <!-- frame -->
  <rect x="40" y="40" width="1000" height="1200" fill="none" stroke="#111" stroke-width="5"/>

  <!-- bottom margin -->
  <circle cx="48" cy="1292" r="8" class="blue ink" stroke-width="3"/>
  <text x="66" y="1299" class="body" font-size="18" font-weight="700" fill="#111" letter-spacing=".2">#ProtonX50  #ProtonSUV  #ProAutoDrive  #PetalingJaya  #DriveIntoNovember</text>
  <text x="1040" y="1305" text-anchor="end" class="display" font-size="42" fill="#111">proautodrive</text>

  <!-- print grain -->
  <rect width="1080" height="1350" filter="url(#grain)" opacity=".09" style="mix-blend-mode: multiply"/>
</svg>
</body>
</html>
